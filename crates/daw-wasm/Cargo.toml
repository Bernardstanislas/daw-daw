[package]
name = "daw-wasm"
version = "0.1.0"
edition = "2024"
description = "daw-daw engine compiled to WebAssembly, driven from an AudioWorklet (plain C ABI, no bindgen)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
daw-core = { path = "../daw-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 0
opt-level = 1
