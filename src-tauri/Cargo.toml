[package]
name = "daw"
version = "0.1.0"
description = "daw-daw — a small DAW"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "daw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
daw-core = { path = "../crates/daw-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
rtrb = "0.4.1"
hound = "3.5.1"
midir = "0.11.1"
anyhow = "1.0.104"
parking_lot = "0.13.0"
dirs = "7.0.0"
tauri-plugin-dialog = "2.8.4"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep debug builds small (no debuginfo, no incremental cache) and DSP fast.
[profile.dev]
debug = 0
incremental = false
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
